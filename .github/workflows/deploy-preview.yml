name: Deploy Preview

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy to Preview
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://preview.kspdowa.in

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT || '22' }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with rsync
        run: |
          rsync -avz --exclude '.git' --exclude '.github' -e "ssh -p ${{ secrets.SSH_PORT || '22' }} -i ~/.ssh/id_rsa" ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/u278446798/domains/kspdowa.in/public_html/preview/
