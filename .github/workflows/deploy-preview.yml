name: Deploy Preview

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy to Preview
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://preview.kspdowa.in

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Clean stale nested folder (first-deploy artefact)
        env:
          SSH_USER: u278446798
          SSH_HOST: kspdowa.in
          SSH_PORT: 65002
        run: |
          ssh -p $SSH_PORT -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST \
            "rm -rf /home/u278446798/domains/kspdowa.in/public_html/preview/public_html"

      - name: Deploy with rsync
        env:
          SSH_USER: u278446798
          SSH_HOST: kspdowa.in
          SSH_PORT: 65002
        run: |
          rsync -rltvz --delete -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=no" \
            ./public_html/ $SSH_USER@$SSH_HOST:/home/u278446798/domains/kspdowa.in/public_html/preview/

