name: Deploy Preview

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy to Preview
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://preview.kspdowa.in

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_HOST: kspdowa.in
          SSH_PORT: 65002
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy with rsync
        env:
          SSH_USER: u278446798
          SSH_HOST: kspdowa.in
          SSH_PORT: 65002
        run: |
          rsync -rltvz --exclude '.git' --exclude '.github' -e "ssh -p $SSH_PORT -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" ./ $SSH_USER@$SSH_HOST:/home/u278446798/domains/kspdowa.in/public_html/preview/
