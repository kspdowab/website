name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kspdowa.in

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_HOST: kspdowa.in
          SSH_PORT: 65002
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p $SSH_PORT -H $SSH_HOST >> ~/.ssh/known_hosts

      - name: Deploy with rsync
        env:
          SSH_USER: u278446798
          SSH_HOST: kspdowa.in
          SSH_PORT: 65002
        run: |
          rsync -avz --exclude '.git' --exclude '.github' -e "ssh -p $SSH_PORT -i ~/.ssh/id_rsa" ./ $SSH_USER@$SSH_HOST:/home/u278446798/domains/kspdowa.in/public_html/
