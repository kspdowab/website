name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kspdowa.in

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: kspdowa.in
          SSH_PORT: 65002
        run: |
          mkdir -p ~/.ssh
          if [ -z "$SSH_PRIVATE_KEY_B64" ]; then
            echo "::error::SSH_PRIVATE_KEY is empty! Please verify GitHub Settings -> Environments -> production -> Environment secrets (or Repository secrets)."
            exit 1
          fi
          if echo "$SSH_PRIVATE_KEY_B64" | grep -q -- "-----BEGIN"; then
            printf '%s\n' "$SSH_PRIVATE_KEY_B64" > ~/.ssh/deploy_key
          else
            echo "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n ' | base64 -d -i > ~/.ssh/deploy_key || true
          fi
          if [ ! -s ~/.ssh/deploy_key ]; then
            echo "::error::Failed to decode SSH_PRIVATE_KEY or key is empty!"
            exit 1
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p $SSH_PORT $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy with rsync
        env:
          SSH_USER: u278446798
          SSH_HOST: kspdowa.in
          SSH_PORT: 65002
        run: |
          rsync -rltvz --delete \
            --exclude='preview/' \
            --exclude='config/*.secret.php' \
            --exclude='uploads/members/photos/*' \
            --exclude='uploads/documents/*' \
            --exclude='uploads/receipts/*' \
            --exclude='uploads/grievances/*' \
            --exclude='uploads/suggestions/*' \
            --exclude='uploads/news/*' \
            --exclude='uploads/temp/*' \
            --exclude='assets/images/gallery/*' \
            --exclude='assets/images/office-bearers/*' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=no" \
            ./public_html/ $SSH_USER@$SSH_HOST:/home/u278446798/domains/kspdowa.in/public_html/
