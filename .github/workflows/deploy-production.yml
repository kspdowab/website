name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kspdowa.in

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy with rsync
        env:
          SSH_USER: u278446798
          SSH_HOST: kspdowa.in
          SSH_PORT: 65002
        run: |
          rsync -rltvz -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=no" ./public_html/ $SSH_USER@$SSH_HOST:/home/u278446798/domains/kspdowa.in/public_html/
